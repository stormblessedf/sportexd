<body class="bg-background-light dark:bg-background-dark font-display text-gray-900 dark:text-white antialiased overflow-x-hidden">

<div class="w-16 h-16 rounded-2xl bg-primary flex items-center justify-center shadow-lg shadow-primary/30 transition-transform group-active:scale-95">

</div>
<span class="text-sm font-semibold text-black dark:text-white">Running</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-16 h-16 rounded-2xl bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-700 flex items-center justify-center transition-transform group-active:scale-95">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 text-3xl">pedal_bike</span>
</div>
<span class="text-sm font-medium text-gray-500 dark:text-gray-400">Cycling</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-16 h-16 rounded-2xl bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-700 flex items-center justify-center transition-transform group-active:scale-95">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 text-3xl">fitness_center</span>
</div>
<span class="text-sm font-medium text-gray-500 dark:text-gray-400">Gym</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-16 h-16 rounded-2xl bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-700 flex items-center justify-center transition-transform group-active:scale-95">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 text-3xl">self_improvement</span>
</div>
<span class="text-sm font-medium text-gray-500 dark:text-gray-400">Yoga</span>
</button>
<button class="flex flex-col items-center gap-2 shrink-0 group">
<div class="w-16 h-16 rounded-2xl bg-white dark:bg-surface-dark border border-gray-100 dark:border-gray-700 flex items-center justify-center transition-transform group-active:scale-95">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 text-3xl">sports_tennis</span>
</div>
<span class="text-sm font-medium text-gray-500 dark:text-gray-400">Tennis</span>
</button>
</div>

</div>

<span class="material-symbols-outlined text-gray-400">chevron_left</span>
</button>
<span class="text-base font-bold">October 2023</span>
<button class="p-1 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full">
<span class="material-symbols-outlined text-gray-400">chevron_right</span>
</button>
</div>

<div class="text-xs font-medium text-gray-400 uppercase pb-2">T</div>
<div class="text-xs font-medium text-gray-400 uppercase pb-2">W</div>
<div class="text-xs font-medium text-gray-400 uppercase pb-2">T</div>
<div class="text-xs font-medium text-gray-400 uppercase pb-2">F</div>
<div class="text-xs font-medium text-gray-400 uppercase pb-2">S</div>
<button class="h-9 w-9 rounded-full flex items-center justify-center text-sm text-gray-400">1</button>
<button class="h-9 w-9 rounded-full flex items-center justify-center text-sm text-gray-400">2</button>
<button class="h-9 w-9 rounded-full flex items-center justify-center text-sm text-gray-400">3</button>
<button class="h-9 w-9 rounded-full flex items-center justify-center text-sm text-gray-900 dark:text-white font-medium">4</button>
<button class="h-9 w-9 rounded-full flex items-center justify-center text-sm bg-primary text-black font-bold shadow-lg shadow-primary/40">5</button>
<button class="h-9 w-9 rounded-full flex items-center justify-center text-sm text-gray-900 dark:text-white font-medium">6</button>
<button class="h-9 w-9 rounded-full flex items-center justify-center text-sm text-gray-900 dark:text-white font-medium">7</button>
</div>
<div class="flex items-center justify-between bg-background-light dark:bg-black/20 rounded-xl p-3 px-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-400">schedule</span>
<div class="flex flex-col">
<span class="text-xs text-gray-500 dark:text-gray-400 font-medium uppercase">Start</span>
<span class="font-bold text-gray-900 dark:text-white">07:00 AM</span>
</div>
</div>
<div class="h-8 w-[1px] bg-gray-200 dark:bg-gray-700"></div>
<div class="flex items-center gap-3">
<div class="flex flex-col items-end">
<span class="text-xs text-gray-500 dark:text-gray-400 font-medium uppercase">End</span>
<span class="font-bold text-gray-900 dark:text-white">08:30 AM</span>
</div>
</div>
</div>
</div>
</section>

<div class="truncate text-sm font-semibold">Maçka Demokrasi Parkı</div>
</div>
</div>
</section>
<section>

<label class="absolute -top-2.5 left-3 bg-background-light dark:bg-background-dark px-1 text-xs font-medium text-gray-500 dark:text-gray-400" for="event-title">Event Title</label>
<input class="w-full bg-transparent border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 text-base font-semibold focus:border-primary focus:ring-0 placeholder-gray-400 dark:text-white transition-colors" id="event-title" type="text" value="Morning Run 5K"/>
</div>
<div class="relative">
<label class="absolute -top-2.5 left-3 bg-background-light dark:bg-background-dark px-1 text-xs font-medium text-gray-500 dark:text-gray-400" for="event-desc">Description</label>
<textarea class="w-full bg-transparent border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3 text-sm focus:border-primary focus:ring-0 placeholder-gray-400 resize-none dark:text-white transition-colors" id="event-desc" rows="3">Easy pace morning run around the park. Everyone is welcome!</textarea>
</div>
<div class="relative">
<label class="absolute -top-2.5 left-3 bg-background-light dark:bg-background-dark px-1 text-xs font-medium text-gray-500 dark:text-gray-400">Participant Limit</label>
<div class="flex items-center justify-between w-full bg-transparent border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-2">
<span class="text-base font-semibold text-gray-900 dark:text-white">Max Participants</span>
<div class="flex items-center gap-3">
<button class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
<span class="material-symbols-outlined text-lg text-gray-600 dark:text-gray-400">remove</span>
</button>
<span class="text-lg font-bold text-gray-900 dark:text-white w-6 text-center">4</span>
<button class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-lg shadow-primary/30 hover:bg-primary/90 transition-colors">

</div>
</div>
</div>
<div class="relative">
<label class="absolute -top-2.5 left-3 bg-background-light dark:bg-background-dark px-1 text-xs font-medium text-gray-500 dark:text-gray-400">Skill Level</label>

<div class="flex items-center gap-2">

<button class="flex-1 py-2.5 rounded-full bg-primary border border-primary text-black text-xs font-bold shadow-md shadow-primary/20">Intermediate</button>
<button class="flex-1 py-2.5 rounded-full border border-gray-200 dark:border-gray-700 text-xs font-bold text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-white/5 transition-colors">Advanced</button>
</div>
</div>
</div>
</div>
</section>
</main>
<div class="fixed bottom-0 left-0 right-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-lg border-t border-gray-100 dark:border-gray-800 p-5 z-20 max-w-md mx-auto">
